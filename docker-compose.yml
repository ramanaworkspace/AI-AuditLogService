services:
  postgres:
    image: postgres:17-alpine
    container_name: audit-log-postgres
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_log
      POSTGRES_PASSWORD: ${AUDITLOG_POSTGRES_PASSWORD:?Set AUDITLOG_POSTGRES_PASSWORD externally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_log -d audit_log"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    container_name: audit-log-postgres-test
    environment:
      POSTGRES_DB: audit_log_test
      POSTGRES_USER: audit_log
      POSTGRES_PASSWORD: ${AUDITLOG_TEST_POSTGRES_PASSWORD:?Set AUDITLOG_TEST_POSTGRES_PASSWORD externally}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_log -d audit_log_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
