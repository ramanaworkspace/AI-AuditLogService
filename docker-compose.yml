services:
  postgres:
    image: postgres:17-alpine
    container_name: audit-log-postgres
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_log
      POSTGRES_PASSWORD: audit_log_development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_log -d audit_log"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
